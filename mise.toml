[tasks.check]
description = "Fast local gate: format + lint + test"
run = "mise run format && mise run lint && mise run test"

[tasks.format]
description = "Format code"
run = "cargo fmt"

[tasks.format-check]
description = "Verify formatting"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Lint with clippy"
run = "cargo clippy -- -D warnings"

[tasks.test]
description = "Run unit tests"
run = "cargo test --lib"

[tasks.test-integration]
description = "Run integration tests (requires KVM + /tmp/redan-rootfs)"
run = "cargo test --test integration -- --ignored"

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks.bench]
description = "Boot-to-proxy benchmark (requires KVM + image)"
run = "./tests/bench_boot.sh"

[tasks.test-distro]
description = "Distro compatibility tests (requires KVM + docker)"
run = "./tests/distro_compat.sh"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

# Security audit tasks (Rust equivalent of ruff/bandit)
[tasks.audit]
description = "Run all security audits (cargo-audit + cargo-deny)"
run = "mise run audit-deps && mise run audit-unsafe"

[tasks.audit-deps]
description = "Check for vulnerable/outdated dependencies (cargo-audit + cargo-deny)"
run = """
cargo audit
cargo deny check advisories
"""

[tasks.audit-unsafe]
description = "Detect unsafe code usage (cargo-geiger)"
run = "cargo geiger --all-features --all-targets || true"

[tasks.audit-licenses]
description = "Check license compliance (cargo-deny)"
run = "cargo deny check licenses"

[tasks.clippy-security]
description = "Run clippy with security-focused lints"
run = """
cargo clippy --all-targets --all-features -- \
  -D warnings \
  -W clippy::pedantic \
  -W clippy::nursery \
  -W clippy::unwrap_used \
  -W clippy::expect_used \
  -W clippy::panic \
  -W clippy::unwrap_in_result \
  -W clippy::fallible_impl_from \
  -W clippy::string_slice
"""
