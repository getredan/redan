[tasks.check]
description = "Fast local gate: format + lint + test"
run = "mise run format && mise run lint && mise run test"

[tasks.format]
description = "Format code"
run = "cargo fmt"

[tasks.format-check]
description = "Verify formatting"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Lint with clippy"
run = """
cargo clippy --all-targets --all-features -- \
  -D warnings \
  -W clippy::pedantic \
  -W clippy::nursery \
  -W clippy::unwrap_used \
  -W clippy::expect_used \
  -W clippy::panic \
  -W clippy::unwrap_in_result \
  -W clippy::fallible_impl_from \
  -W clippy::string_slice
"""

[tasks.test]
description = "Run all tests (requires KVM + rootfs + Vault)"
# Vm::boot forks; forking from a threaded test harness can deadlock
# the child on locks held by other test threads. Only integration
# tests call Vm::boot, so only that binary is serialized.
run = """
cargo test --lib --test adversarial --test vault && \
cargo test --test integration -- --test-threads=1
"""

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks.install]
description = "Build and install to ~/.cargo/bin"
# --locked: cargo install otherwise ignores Cargo.lock and re-resolves, which
# can pull a newer `time` that conflicts with `rcgen` (trait impl clash, E0119).
run = "cargo install --path . --locked"

[tasks.bench]
description = "Boot-to-proxy benchmark (requires KVM + image)"
run = "./tests/bench_boot.sh"

[tasks.test-distro]
description = "Distro compatibility tests (requires KVM + docker)"
run = "./tests/distro_compat.sh"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.audit]
description = "Check dependencies for vulnerabilities and license issues"
run = """
cargo audit
cargo deny check
"""

[tools]
vault = "latest"
