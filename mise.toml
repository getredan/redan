[env]
VAULT_ADDR = "http://127.0.0.1:8200"
VAULT_TOKEN = "redan-dev-token"

[tasks.check]
description = "Fast local gate: format + lint + test"
run = "mise run format && mise run lint && mise run test"

[tasks.format]
description = "Format code"
run = "cargo fmt"

[tasks.format-check]
description = "Verify formatting"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Lint with clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests (requires KVM + test image + Vault)"
# Vm::boot forks; forking from a threaded test harness can deadlock
# the child on locks held by other test threads. Only integration
# tests call Vm::boot, so only that binary is serialized. The e2e
# tests boot VMs inside the redan processes they start.
run = """
cargo test --no-fail-fast --lib --bin redan --test adversarial --test vault --test e2e && \
cargo test --test integration -- --test-threads=1
"""

[tasks.e2e]
description = "End-to-end tests, including the Claude Code evals that use your Claude token and the real API"
run = "cargo test --test e2e -- --include-ignored"

[tasks.test-setup]
description = "Create test image and start Vault"
run = """
cargo run -- image list 2>/dev/null | grep -q '^test ' || cargo run -- image create test
docker compose up -d vault
./scripts/seed-vault.sh
"""

[tasks.vault-up]
description = "Start Vault dev server and seed test data"
run = """
docker compose up -d vault
./scripts/seed-vault.sh
"""

[tasks.vault-down]
description = "Stop Vault dev server"
run = "docker compose down"

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks.install]
description = "Build and install to ~/.cargo/bin"
# --locked: cargo install otherwise ignores Cargo.lock and re-resolves, which
# can pull a newer `time` that conflicts with `rcgen` (trait impl clash, E0119).
run = "cargo install --path . --locked"

[tasks.bench]
description = "Boot-to-proxy benchmark (requires KVM + image)"
run = "./tests/bench_boot.sh"

[tasks.test-distro]
description = "Distro compatibility tests (requires KVM + docker)"
run = "./tests/distro_compat.sh"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.audit]
description = "Check dependencies for vulnerabilities and license issues"
run = """
cargo audit
cargo deny check
"""

[tools]
vault = "1.19"
