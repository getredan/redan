[package]
name = "redan"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
description = "Secure, local-first execution environment for AI coding agents"
repository = "https://github.com/getredan/redan"

[lib]
name = "redan"
path = "src/lib.rs"

[[bin]]
name = "redan"
path = "src/main.rs"

[dependencies]
smoltcp = { version = "0.14.0", features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "log"] }
rustls = "0.23.40"
rustls-pemfile = "2.2"
rcgen = "0.14.8"
webpki-roots = "1.0"
log = "0.4.29"
env_logger = "0.11.10"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2.186"
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = "3"
httparse = "1.10.1"
zeroize = { version = "1.8.2", features = ["derive"] }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "1.1"
minijinja = "2.19.0"
thiserror = "2.0.18"
shell-words = "1.1.1"
getrandom = "0.4"
base64 = "0.22.1"
# Already in the tree via rustls; used directly for SHA-256 of trusted configs.
ring = "0.17"

[features]
test-support = []

# Lint levels live here so `cargo clippy`, `mise run lint` and CI agree. The
# only flag callers add is `-D warnings`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Restriction lints are opt-in one by one.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
string_slice = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Nursery lint that asks for `pub` inside private modules. `pub(crate)` states
# the intended visibility of the `cmd` handlers, so that wins.
redundant_pub_crate = "allow"

[dev-dependencies]
flate2 = "1.1.9"
tempfile = "3"
redan = { path = ".", features = ["test-support"] }
