[package]
name = "redan"
version = "0.3.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Secure, local-first execution environment for AI coding agents"
repository = "https://github.com/getredan/redan"

[lib]
name = "redan"
path = "src/lib.rs"

[[bin]]
name = "redan"
path = "src/main.rs"

[dependencies]
smoltcp = { version = "0.12.0", features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "log"] }
rustls = "0.23.36"
rustls-pemfile = "2.2"
rcgen = "0.14.7"
webpki-roots = "1.0"
log = "0.4.29"
env_logger = "0.11.8"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2.180"
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = "3"
httparse = "1.10.1"
zeroize = { version = "1.8.2", features = ["derive"] }
time = { version = "0.3.47", features = ["formatting"] }
toml = "1.0"
minijinja = "2.16.0"
thiserror = "2.0.18"
shell-words = "1.1.1"
getrandom = "0.4"
base64 = "0.22.1"

[features]
test-support = []

[dev-dependencies]
flate2 = "1.1.9"
tempfile = "3"
redan = { path = ".", features = ["test-support"] }
