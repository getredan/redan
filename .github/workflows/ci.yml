name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Unit and adversarial tests don't call libkrun, but the binary
      # links against it. Provide stub symbols so linking succeeds.
      # VM integration tests are #[ignore] and need real libkrun + KVM.
      - name: Create libkrun stub
        run: |
          cat > /tmp/libkrun_stub.c << 'EOF'
          int krun_init_log(void) { return 0; }
          int krun_create_ctx(void) { return 0; }
          int krun_set_vm_config(void) { return 0; }
          int krun_set_root(void) { return 0; }
          int krun_set_workdir(void) { return 0; }
          int krun_set_exec(void) { return 0; }
          int krun_start_enter(void) { return 0; }
          int krun_add_net_unixstream(void) { return 0; }
          int krun_add_virtiofs(void) { return 0; }
          int krun_set_console_output(void) { return 0; }
          int krun_set_rlimits(void) { return 0; }
          EOF
          gcc -shared -o /tmp/libkrun.so /tmp/libkrun_stub.c
          sudo cp /tmp/libkrun.so /usr/lib/
          sudo ldconfig

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
