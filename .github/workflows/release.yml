name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install libkrun stub
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            aarch64-linux-gnu-gcc -shared -o /tmp/libkrun.so ci/libkrun_stub.c
            sudo mkdir -p /usr/aarch64-linux-gnu/lib
            sudo cp /tmp/libkrun.so /usr/aarch64-linux-gnu/lib/
          else
            gcc -shared -o /tmp/libkrun.so ci/libkrun_stub.c
            sudo cp /tmp/libkrun.so /usr/lib/
            sudo ldconfig
          fi

      - name: Build release
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export RUSTFLAGS="-L /usr/aarch64-linux-gnu/lib"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf redan-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz redan
          sha256sum redan-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz \
            > redan-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: redan-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/redan-*.tar.gz
            target/${{ matrix.target }}/release/redan-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            redan-*.tar.gz
            redan-*.sha256
          body: |
            See the [changelog](https://github.com/getredan/redan/blob/main/CHANGELOG.md) for details.

            ## Install

            ```bash
            # x86_64
            curl -L https://github.com/getredan/redan/releases/download/${{ github.ref_name }}/redan-${{ github.ref_name }}-linux-x86_64.tar.gz | tar xz
            sudo mv redan /usr/local/bin/

            # aarch64
            curl -L https://github.com/getredan/redan/releases/download/${{ github.ref_name }}/redan-${{ github.ref_name }}-linux-aarch64.tar.gz | tar xz
            sudo mv redan /usr/local/bin/
            ```

            Requires libkrun and KVM at runtime. See [README](https://github.com/getredan/redan#installation) for details.
          generate_release_notes: true
